<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Report | XTERA Job Reports</title>
  <link rel="icon" type="image/png" href="../assets/logo/xtera-logo-square-icon-512x512.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
  <div class="no-print bg-dark py-2">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 900px;">
      <a href="#" class="btn btn-outline-light btn-sm" id="backBtn"><i class="bi bi-arrow-left me-1"></i> Back to job</a>
      <button class="btn btn-primary btn-sm" id="printBtn"><i class="bi bi-printer me-1"></i> Print / Save as PDF</button>
    </div>
  </div>

  <main class="report-page my-0 my-lg-4">
    <div class="report-header d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div>
        <div class="mb-1">
          <img src="../assets/logo/xtera-logo-landscape-512x128.png" alt="XTERA Exterior Cleaning Services" class="brand-logo brand-logo-lg" width="256" height="64">
        </div>
        <div id="companyDetails" class="text-muted-small"></div>
      </div>
      <div class="text-end">
        <h1 class="h4 mb-1">Job Report</h1>
        <div class="text-muted-small" id="reportMeta"></div>
      </div>
    </div>

    <section class="mb-4">
      <div class="report-section-title">Job details</div>
      <dl class="row mb-0">
        <dt class="col-sm-3">Job number</dt><dd class="col-sm-9" id="jobNumber"></dd>
        <dt class="col-sm-3">Status</dt><dd class="col-sm-9" id="status"></dd>
        <dt class="col-sm-3">Type of work</dt><dd class="col-sm-9" id="workType"></dd>
        <dt class="col-sm-3">Date created</dt><dd class="col-sm-9" id="createdAt"></dd>
        <dt class="col-sm-3">Description</dt><dd class="col-sm-9" id="description" style="white-space: pre-wrap;"></dd>
      </dl>
    </section>

    <section class="mb-4">
      <div class="report-section-title">Client &amp; property</div>
      <dl class="row mb-0">
        <dt class="col-sm-3">Client</dt><dd class="col-sm-9" id="clientName"></dd>
        <dt class="col-sm-3">Email</dt><dd class="col-sm-9" id="clientEmail"></dd>
        <dt class="col-sm-3">Phone</dt><dd class="col-sm-9" id="clientPhone"></dd>
        <dt class="col-sm-3">Property</dt><dd class="col-sm-9" id="propertyAddress"></dd>
      </dl>
    </section>

    <section class="mb-4">
      <div class="report-section-title">Terms &amp; conditions acceptance</div>
      <div id="acceptanceSection"></div>
    </section>

    <section class="mb-4">
      <div class="report-section-title">Site notes</div>
      <div id="notesSection"></div>
    </section>

    <section class="mb-4">
      <div class="report-section-title">Before &amp; after photos</div>
      <div id="photosSection"></div>
    </section>

    <section>
      <div class="report-section-title">History</div>
      <ul class="history-list" id="historySection"></ul>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/report.js"></script>
</body>
</html>
