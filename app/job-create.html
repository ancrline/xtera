<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Job | XTERA Job Reports</title>
  <link rel="icon" type="image/png" href="logo/xtera-logo-square-icon-512x512.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
  <div id="appNavbar"></div>

  <main class="container py-4" style="max-width: 860px;">
    <div class="page-header">
      <div>
        <h1 class="h3 mb-0">Create Job</h1>
        <p class="text-muted-small mb-0">Created date is recorded automatically when you save.</p>
      </div>
      <a href="dashboard.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
    </div>

    <div class="card">
      <div class="card-header">Job details</div>
      <div class="card-body">
        <form id="jobForm">
          <h2 class="h6 text-uppercase text-muted mb-3">Client</h2>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label" for="clientName">Client full name or company name *</label>
              <input type="text" class="form-control" id="clientName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="clientEmail">Client email *</label>
              <input type="email" class="form-control" id="clientEmail" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="clientPhone">Client phone *</label>
              <input type="tel" class="form-control" id="clientPhone" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="propertyAddress">Property address *</label>
              <input type="text" class="form-control" id="propertyAddress" required>
            </div>
          </div>

          <h2 class="h6 text-uppercase text-muted mb-3">Work</h2>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label" for="workType">Type of work *</label>
              <div id="serviceRows"></div>
              <button class="btn btn-outline-primary btn-sm" type="button" id="addServiceBtn">
                <i class="bi bi-plus-lg"></i> Add another service
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="description">Job description</label>
            <textarea class="form-control" id="description" rows="4" placeholder="Scope of work, access notes, special requirements…"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="saveBtn">
              <i class="bi bi-check-lg me-1"></i> Create job
            </button>
            <button type="submit" class="btn btn-outline-primary" id="saveAndSendBtn">
              <i class="bi bi-envelope me-1"></i> Create &amp; send T&amp;Cs
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Email preview modal -->
  <div class="modal fade" id="emailPreviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-envelope me-2"></i>Email preview — Terms &amp; Conditions</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><strong>To:</strong> <span id="emailPreviewTo"></span></p>
          <p><strong>Subject:</strong> <span id="emailPreviewSubject"></span></p>
          <pre class="bg-light border rounded p-3 small" id="emailPreviewBody" style="white-space: pre-wrap;"></pre>
          <p class="text-muted-small mb-0"><i class="bi bi-info-circle me-1"></i>The client receives this email with a secure link to review and accept the terms. The send is recorded in the email log.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="emailPreviewSend"><i class="bi bi-send me-1"></i> Send email</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js?v=8"></script>
  <script src="js/pages/job-create.js?v=7"></script>
</body>
</html>
