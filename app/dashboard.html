<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | XTERA Job Reports</title>
  <link rel="icon" type="image/png" href="../assets/logo/xtera-logo-square-icon-512x512.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="appNavbar"></div>

  <main class="container-fluid py-4 px-lg-5">
    <div class="page-header">
      <div>
        <h1 class="h3 mb-0">Jobs</h1>
        <p class="text-muted-small mb-0">All jobs, newest first. Click a row to open it.</p>
      </div>
      <a href="job-create.html" class="btn btn-primary" id="newJobBtn">
        <i class="bi bi-plus-lg me-1"></i> New Job
      </a>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="search" class="form-control" id="searchInput" placeholder="Search job #, client, address, work type…">
          </div>
          <div class="col-md-3">
            <select class="form-select" id="statusFilter">
              <option value="">All statuses</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table job-table align-middle mb-0">
          <thead>
            <tr>
              <th>Job #</th>
              <th>Client</th>
              <th>Property</th>
              <th>Work type</th>
              <th>Created</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="jobsTbody"></tbody>
        </table>
      </div>
      <div class="card-body text-center text-muted d-none" id="emptyState">
        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
        No jobs match your filters.
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
