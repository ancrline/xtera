<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | XTERA Job Reports</title>
  <link rel="icon" type="image/png" href="logo/xtera-logo-square-icon-512x512.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="card-body">
        <div class="mb-4">
          <img src="logo/xtera-logo-square-icon-512x512.png" alt="XTERA" style="width: 80px; height: 80px; display: block; margin: 0 auto;">
        </div>

        <h1 class="h5 mb-3">Choose a new password</h1>

        <div id="resetError" class="alert alert-danger py-2 d-none"></div>
        <div id="resetSuccess" class="alert alert-success py-2 d-none">
          Your password has been updated. <a href="login.html">Sign in</a>
        </div>

        <form id="resetForm">
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input type="password" class="form-control" id="password" required minlength="10" autocomplete="new-password">
            <div class="form-text">At least 10 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirmPassword">Confirm new password</label>
            <input type="password" class="form-control" id="confirmPassword" required minlength="10" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-100" id="resetBtn">
            <i class="bi bi-key me-1"></i> Reset password
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="login.html" class="small">Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/pages/reset-password.js?v=3"></script>
</body>
</html>
