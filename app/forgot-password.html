<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | XTERA Job Reports</title>
  <link rel="icon" type="image/png" href="logo/xtera-logo-square-icon-512x512.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="card-body">
        <div class="mb-4">
          <img src="logo/xtera-logo-square-icon-512x512.png" alt="XTERA" style="width: 80px; height: 80px; display: block; margin: 0 auto;">
        </div>

        <h1 class="h5 mb-2">Forgot your password?</h1>
        <p class="text-muted-small">Enter your email and we'll send you a link to reset it.</p>

        <div id="resetError" class="alert alert-danger py-2 d-none"></div>
        <div id="resetSuccess" class="alert alert-success py-2 d-none"></div>

        <form id="forgotForm">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" required autocomplete="username">
          </div>
          <button type="submit" class="btn btn-primary w-100" id="forgotBtn">
            <i class="bi bi-envelope me-1"></i> Send reset link
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="login.html" class="small">Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/pages/forgot-password.js?v=3"></script>
</body>
</html>
