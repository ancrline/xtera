<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Thank you | XTERRA</title>

  <script>
    // Only reachable straight after a successful enquiry submission.
    if (sessionStorage.getItem("enquirySubmitted") === "true") {
      sessionStorage.removeItem("enquirySubmitted");
    } else {
      window.location.replace("index.html");
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--navy); color: #fff; }
    .thanks-main { flex: 1; display: flex; align-items: center; padding: 4rem 0; }
    .thanks-card { max-width: 640px; margin: 0 auto; text-align: center; background: var(--navy-2); border-radius: var(--radius); padding: 3rem 2rem; box-shadow: var(--shadow); }
    .thanks-icon { font-size: 4rem; color: var(--cyan); line-height: 1; }
    .thanks-card h1 { font-size: clamp(2rem, 5vw, 2.75rem); margin: 1rem 0; }
    .thanks-card p { color: rgba(255, 255, 255, .8); }
  </style>
</head>

<body class="thanks-page">
  <nav class="navbar navbar-dark xt-nav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark">X</span>
        <span class="brand-word">TERRA</span>
      </a>
    </div>
  </nav>

  <main class="thanks-main">
    <div class="container">
      <div class="thanks-card">
        <div class="thanks-icon"><i class="bi bi-check-circle-fill"></i></div>
        <h1>Thank you!</h1>
        <p>Your enquiry has been sent to the XTERRA team. We'll review it and get back to you by email as soon as possible.</p>
        <p>Need us sooner? Call <a class="call-cta" data-phone-href href="#"><strong data-phone></strong></a>.</p>
        <a class="btn btn-primary btn-lg px-4 mt-3" href="index.html">
          <i class="bi bi-arrow-left me-2"></i> Back to home
        </a>
      </div>
    </div>
  </main>

  <script>
    const PHONE = "0800326002";
    document.querySelectorAll("[data-phone]").forEach(el => { el.textContent = PHONE; });
    document.querySelectorAll("[data-phone-href]").forEach(el => { el.href = `tel:${PHONE}`; });
  </script>
</body>
</html>
